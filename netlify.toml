[build]
  functions = "netlify/functions"
  # publish was "." — that served the whole repo, source files included.
  # An empty public/ folder keeps the repo private while the functions still run.

[functions]
  node_bundler = "esbuild"

# Clean /api/... URLs. status = 200 is a rewrite, so POST bodies and the
# stripe-signature header pass through byte-for-byte.

[[redirects]]
  from = "/api/create-booking"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/api/camp-availability"
  to = "/.netlify/functions/camp-availability"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/get-booking-confirmation"
  to = "/.netlify/functions/get-booking-confirmation"
  status = 200
