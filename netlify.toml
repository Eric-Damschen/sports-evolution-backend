[build]
  functions = "netlify/functions"
  # Serves the repo root, exactly as the previously working setup did.
  # No separate publish folder is needed, so the deploy cannot fail on a
  # missing directory. A 404 on "/" is expected — there is no homepage here.
  publish = "."

# Clean /api/... URLs. status = 200 is a rewrite, so POST bodies and the
# stripe-signature header pass through byte-for-byte.

[[redirects]]
  from = "/api/create-booking"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/api/camp-availability"
  to = "/.netlify/functions/camp-availability"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/get-booking-confirmation"
  to = "/.netlify/functions/get-booking-confirmation"
  status = 200

# Removes rows for checkouts that were never paid. Runs every 15 minutes and
# waits while anyone is mid-checkout. Scheduled functions only run on the
# published production deploy — use "Run now" in the Netlify Functions tab
# to trigger it by hand.
[functions."cleanup-abandoned"]
  schedule = "*/15 * * * *"
